<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ industry_name }} — Activation Required</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-semibold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #faf7f2;
      --sur: #f2ede4;
      --sur2: #e8e2d8;
      --bdr: #ddd8ce;
      --bdr2: #cec8bc;
      --tx: #1c1a16;
      --tx2: #5a5248;
      --tx3: #8a8078;
      --accent: #c96442;
      --accent-lt: #a84e32;
      --green: #2d7a4a;
      --gbg: rgba(45, 122, 74, .08);
      --red: #a83820;
      --rbg: rgba(168, 56, 32, .08);
      --r: 10px;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--sur);
      border: 1px solid var(--bdr);
      border-radius: var(--r);
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header svg {
      width: 48px;
      height: 48px;
      fill: var(--accent);
      margin-bottom: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: var(--tx);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--tx2);
    }

    .info-box {
      background: var(--sur2);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--bdr);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-lbl {
      color: var(--tx3);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-val {
      font-weight: 600;
      color: var(--tx);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-lbl {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tx2);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border: 1px solid var(--bdr);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--tx);
      resize: none;
      transition: border-color 0.15s ease;
    }

    textarea:focus {
      border-color: var(--accent);
      outline: none;
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--accent-lt);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }

    .alert.error {
      background: var(--rbg);
      color: var(--red);
      border: 1px solid rgba(168, 56, 32, 0.2);
      display: block;
    }

    .alert.success {
      background: var(--gbg);
      color: var(--green);
      border: 1px solid rgba(45, 122, 74, 0.2);
      display: block;
    }

    .contact-info {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--tx3);
      border-top: 1px solid var(--bdr);
      padding-top: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <svg viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
      <div class="title">License Required</div>
      <div class="subtitle">Please activate the dashboard for your business</div>
    </div>

    {% if error %}
    <div class="alert error" id="errorAlert">{{ error }}</div>
    {% else %}
    <div class="alert error" id="errorAlert"></div>
    {% endif %}
    <div class="alert success" id="successAlert"></div>

    <div class="info-box">
      <div class="info-row">
        <span class="info-lbl">Registered Business</span>
        <span class="info-val" id="industryName">{{ industry_name }}</span>
      </div>
      <div class="info-row">
        <span class="info-lbl">Status</span>
        <span class="info-val" style="color: var(--red);">Unlicensed / Expired</span>
      </div>
    </div>

    <form id="activationForm">
      <div class="form-group">
        <label class="form-lbl" for="licenseKey">Paste license.key content</label>
        <textarea id="licenseKey" placeholder='{"expiry_date": "YYYY-MM-DD", "industry_name": "...", "signature": "..."}' required></textarea>
      </div>

      <button type="submit" class="btn" id="activateBtn">
        Activate Dashboard
      </button>
    </form>

    <div class="contact-info">
      Please contact the system administrator to obtain or renew your license key.
    </div>
  </div>

  <script>
    document.getElementById('activationForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const keyVal = document.getElementById('licenseKey').value.trim();
      const errorAlert = document.getElementById('errorAlert');
      const successAlert = document.getElementById('successAlert');
      const activateBtn = document.getElementById('activateBtn');

      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      activateBtn.disabled = true;
      activateBtn.textContent = 'Verifying key...';

      try {
        const response = await fetch('/api/license/activate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ key: keyVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successAlert.textContent = 'Activation successful! Redirecting...';
          successAlert.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          errorAlert.textContent = data.message || 'Invalid activation key.';
          errorAlert.style.display = 'block';
          activateBtn.disabled = false;
          activateBtn.textContent = 'Activate Dashboard';
        }
      } catch (err) {
        errorAlert.textContent = 'Network error. Please try again.';
        errorAlert.style.display = 'block';
        activateBtn.disabled = false;
        activateBtn.textContent = 'Activate Dashboard';
      }
    });
  </script>
</body>

</html>
