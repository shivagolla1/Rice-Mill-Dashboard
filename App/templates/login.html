<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Rice Mill Dashboard</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-semibold.woff2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf7f2;
      --sur: #f2ede4;
      --sur2: #e8e2d8;
      --bdr: #ddd8ce;
      --tx: #1c1a16;
      --tx2: #5a5248;
      --tx3: #8a8078;
      --accent: #c96442;
      --accent-lt: #a84e32;
      --red: #a83820;
      --rbg: rgba(168, 56, 32, .08);
      --font: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: var(--sur);
      border: 1px solid var(--bdr);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 42px;
      margin-bottom: 8px;
      display: block;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: var(--tx);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--tx2);
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      background: var(--rbg);
      color: var(--red);
      border: 1px solid rgba(168, 56, 32, 0.2);
      display: none;
    }
    .alert.show { display: block; }
    .alert.success { background: rgba(40, 140, 60, 0.1); color: #1e6028; border-color: rgba(40, 140, 60, 0.3); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-lbl {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--tx2);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1.5px solid var(--bdr);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--tx);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-lt);
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      margin-top: -6px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000;
    }
    .modal-card {
      background: var(--sur); border: 1px solid var(--bdr); border-radius: 12px;
      padding: 24px; max-width: 380px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="header">
      <span class="header-icon">🌾</span>
      <div class="title">Rice Mill Dashboard</div>
      <div class="subtitle">Sign in to your mill account</div>
    </div>

    <div class="alert {% if error %}show{% endif %}" id="alertBox">
      {{ error if error else "Invalid login credentials" }}
    </div>


    <form id="loginForm" method="POST" action="/login">
      <div class="form-group">
        <label class="form-lbl" for="company_code">Company Code</label>
        <input type="text" id="company_code" name="company_code" placeholder="e.g. ABCD, DEFG" value="{{ company_code or '' }}" required autofocus style="text-transform: uppercase;" />
      </div>


      <div class="form-group">
        <label class="form-lbl" for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. admin or staff" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-lbl" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <a class="forgot-link" onclick="openForgotModal()">Forgot Username / Password?</a>

      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
  </div>

  <!-- Forgot Password / License Key Verification Modal -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-card">
      <h3 style="margin-bottom: 8px; font-size: 16px;">🔑 Reset Password with License Key</h3>
      <p style="font-size: 12px; color: var(--tx2); margin-bottom: 16px;">Enter your Company Code & License Key to reset your password.</p>
      
      <div id="resetMsg" style="display:none; padding:8px 12px; border-radius:6px; font-size:12px; margin-bottom:12px;"></div>

      <div class="form-group">
        <label class="form-lbl">Company Code</label>
        <input type="text" id="resetCompany" placeholder="e.g. DEMO" style="text-transform: uppercase;" />
      </div>
      <div class="form-group">
        <label class="form-lbl">License Key</label>
        <input type="text" id="resetLicenseKey" placeholder="e.g. RM-DEMO-2026" />
      </div>

      <div class="form-group">
        <label class="form-lbl">Username to Reset</label>
        <input type="text" id="resetUsername" value="admin" />
      </div>
      <div class="form-group">
        <label class="form-lbl">New Password</label>
        <input type="password" id="resetNewPass" placeholder="Enter new password" />
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button type="button" class="btn" style="background:var(--tx3);" onclick="closeForgotModal()">Cancel</button>
        <button type="button" class="btn" onclick="submitResetPassword()">Reset Password</button>
      </div>
    </div>
  </div>

  <script>
    function openForgotModal() {
      document.getElementById('resetCompany').value = document.getElementById('company_code').value.toUpperCase();
      document.getElementById('forgotModal').style.display = 'flex';
    }
    function closeForgotModal() {
      document.getElementById('forgotModal').style.display = 'none';
    }
    async function submitResetPassword() {
      const company_code = document.getElementById('resetCompany').value.trim();
      const license_key = document.getElementById('resetLicenseKey').value.trim();
      const username = document.getElementById('resetUsername').value.trim();
      const new_password = document.getElementById('resetNewPass').value.trim();
      const msgBox = document.getElementById('resetMsg');

      if (!company_code || !license_key || !new_password) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(168,56,32,0.1)';
        msgBox.style.color = '#a83820';
        msgBox.innerText = 'Please fill in all fields.';
        return;
      }

      try {
        const resp = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company_code, license_key, username, new_password })
        });
        const res = await resp.json();
        msgBox.style.display = 'block';
        if (resp.ok && res.status === 'ok') {
          msgBox.style.background = 'rgba(40,140,60,0.1)';
          msgBox.style.color = '#1e6028';
          msgBox.innerText = res.message;
          setTimeout(() => { closeForgotModal(); }, 2000);
        } else {
          msgBox.style.background = 'rgba(168,56,32,0.1)';
          msgBox.style.color = '#a83820';
          msgBox.innerText = res.message || 'Reset failed';
        }
      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(168,56,32,0.1)';
        msgBox.style.color = '#a83820';
        msgBox.innerText = 'Network error. Try again.';
      }
    }
  </script>
</body>
</html>
