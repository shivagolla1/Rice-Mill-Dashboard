<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Rice Mill Dashboard</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('/static/fonts/inter-semibold.woff2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf7f2;
      --sur: #f2ede4;
      --sur2: #e8e2d8;
      --bdr: #ddd8ce;
      --tx: #1c1a16;
      --tx2: #5a5248;
      --tx3: #8a8078;
      --accent: #c96442;
      --accent-lt: #a84e32;
      --red: #a83820;
      --rbg: rgba(168, 56, 32, .08);
      --font: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--sur);
      border: 1px solid var(--bdr);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 42px;
      margin-bottom: 8px;
      display: block;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: var(--tx);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--tx2);
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      background: var(--rbg);
      color: var(--red);
      border: 1px solid rgba(168, 56, 32, 0.2);
      display: none;
    }
    .alert.show { display: block; }

    .form-group {
      margin-bottom: 18px;
    }

    .form-lbl {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--tx2);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1.5px solid var(--bdr);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--tx);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-lt);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--tx3);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="header">
      <span class="header-icon">🌾</span>
      <div class="title">Rice Mill Dashboard</div>
      <div class="subtitle">Sign in to continue</div>
    </div>

    <div class="alert {% if error %}show{% endif %}" id="alertBox">
      {{ error or "Invalid username or password" }}
    </div>

    <form id="loginForm" method="POST" action="/login">
      <div class="form-group">
        <label class="form-lbl" for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. admin or staff" required autofocus autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-lbl" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>

    <div class="footer-note">
      Contact system administrator if you forgot your credentials.
    </div>
  </div>
</body>
</html>
